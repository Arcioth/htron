[package]
name = "htron"
version = "0.2.0"
edition = "2021"
authors = ["Arcioth"]
description = "Native Hyprland Cryo-Ophidian Desktop Suite (ctron + daeboard + tunotron)"
license = "MIT OR Apache-2.0"

[dependencies]
gtk4 = { version = "0.9", package = "gtk4" }
libadwaita = { version = "0.7", features = ["v1_4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.21"
libc = "0.2"
anyhow = "1.0"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
